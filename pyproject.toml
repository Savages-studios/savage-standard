[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "savage-standard"
version = "0.5.0"
description = "SIA-E2 One Promotion Standard: SRE-1 receipt envelope + universal verifier for every Savage receipt dialect"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
savage-verify = "savage_standard.cli:main"

[tool.setuptools]
packages = ["savage_standard"]

[tool.setuptools.package-data]
savage_standard = ["key_registry.json"]
